name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tests, lint, builds, demo isolation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Production build
        run: npx vite build --outDir ../build-prod
      - name: Demo build
        run: npx vite build --outDir ../build-demo
        env:
          VITE_DEMO_MODE: 'true'
      - name: Production/demo isolation
        run: node ../scripts/check-demo-isolation.mjs ../build-prod ../build-demo

  backend:
    name: Backend (pytest, startup, smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Baseline initialisation (same as the Render build step)
        run: python -c "from src.baseline_engine import BaselineEngine; BaselineEngine().load_baseline()"
      - run: python -m pytest -q
      - name: Start API
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat ../uvicorn.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke test against the local API
        run: node ../scripts/smoke-backend.mjs http://127.0.0.1:8000
      - name: API log
        if: always()
        run: cat ../uvicorn.log || true
