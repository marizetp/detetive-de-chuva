# Netlify configuration for AgroKairos
# Root configuration pointing to the frontend/ subdirectory

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Node exigido pelo campo `engines` de frontend/package.json. O URL da API (VITE_API_BASE_URL) é
# definido nas variáveis de ambiente do site no Netlify, por contexto, e não aqui.
[build.environment]
  NODE_VERSION = "24"
  VITE_API_EVALUATE_LANG = "true"
  VITE_API_IMERG_LANG = "true"
  VITE_API_PLANTING_LANG = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
